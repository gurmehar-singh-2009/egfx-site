[package]
name = "easygfx-site"
version = "0.1.0"
edition = "2024"
description = "Official website for the EasyGFX Library!"
repository = "https://github.com/gurmehar-singh-2009/easygfx-site"
authors = ["Gurmehar Singh"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
js-sys = "0.3.104"
snafu = "0.9.2"
wasm-bindgen = "0.2.127"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dependencies.web-sys]
version = "0.3.104"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlBodyElement",
    "HtmlScriptElement",
    "HtmlLinkElement",
    "HtmlDivElement",
    "console"
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

nursery = { level = "deny", priority = -1 }

cargo = { level = "deny", priority = -1 }

missing_docs_in_private_items = "warn"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '-all']
